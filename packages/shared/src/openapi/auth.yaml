openapi: 3.1.0
info:
  title: x-web3 API — Auth & Identity
  version: 0.1.0
  description: |
    F01 切片：身份、钱包、RBAC。会话使用 httpOnly cookie；
    Privy access token 用于登录与服务端验证；前端不做 JWT 解析。

servers:
  - url: http://localhost:8080/api/v1
    description: local dev
  - url: https://api.example.com/api/v1
    description: prod (TBD)

tags:
  - name: auth
  - name: me
  - name: wallets

paths:
  /auth/privy/session:
    post:
      tags: [auth]
      summary: 用 Privy access token 登录，返回平台 session
      operationId: postPrivySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privyAccessToken]
              properties:
                privyAccessToken:
                  type: string
                  description: Privy 颁发的短期 access token（前端从 Privy SDK 拿）
      responses:
        '200':
          description: 已登录或新建账户
          headers:
            Set-Cookie:
              schema: { type: string }
              description: sid=<opaque>; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Privy token 无效或过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /auth/session:
    delete:
      tags: [auth]
      summary: 销毁当前 session
      operationId: deleteSession
      responses:
        '204': { description: 已退出 }
        '401':
          description: 未登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /me:
    get:
      tags: [me]
      summary: 当前用户 profile、钱包、权限
      operationId: getMe
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401':
          description: 未登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /me/wallets/link:
    post:
      tags: [wallets]
      summary: 绑定新钱包到当前用户
      operationId: postLinkWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLinkRequest'
      responses:
        '200':
          description: 绑定成功，返回更新后的 wallets 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items: { $ref: '#/components/schemas/Wallet' }
        '409':
          description: 钱包已属于另一个用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: 签名校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /me/wallets/nonce:
    post:
      tags: [wallets]
      summary: 创建一次性钱包签名 challenge
      operationId: postWalletNonce
      responses:
        '200':
          description: challenge 已创建
          content:
            application/json:
              schema:
                type: object
                required: [nonce, domain, expiresAt]
                properties:
                  nonce: { type: string, minLength: 16, maxLength: 64 }
                  domain: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: 未登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /me/wallets/{walletId}:
    delete:
      tags: [wallets]
      summary: 解绑钱包
      operationId: deleteWallet
      parameters:
        - in: path
          name: walletId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已解绑 }
        '409':
          description: 最后一钱包不可解绑，或仍有 pending 订单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  schemas:
    Profile:
      type: object
      required: [id, displayName, roles, permissions, wallets]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        primaryWallet: { $ref: '#/components/schemas/Wallet' }
        wallets:
          type: array
          items: { $ref: '#/components/schemas/Wallet' }
        roles:
          type: array
          items: { type: string, enum: [student, teacher, super_admin] }
        permissions:
          type: array
          items: { type: string }

    Wallet:
      type: object
      required: [id, chainId, address, isPrimary]
      properties:
        id: { type: string, format: uuid }
        chainId: { type: integer }
        address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        isPrimary: { type: boolean }
        boundAt: { type: string, format: date-time }

    WalletLinkRequest:
      type: object
      required: [chainId, address, nonce, expiry, signature]
      properties:
        chainId: { type: integer, minimum: 1 }
        address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        nonce: { type: string, minLength: 16, maxLength: 64 }
        expiry:
          type: string
          format: date-time
          description: 签名过期时间（UTC ISO 8601）
        signature: { type: string, pattern: '^0x[a-fA-F0-9]+$' }
        domain:
          type: string
          description: 防跨站签名滥用，必须等于当前 API 域名

    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: object
          additionalProperties: true
