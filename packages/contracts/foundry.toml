# Foundry configuration for the x-web3 contracts package.
# Docs: https://book.getfoundry.sh/reference/config/solidity-compiler
#       https://book.getfoundry.sh/reference/config/testing
#       https://book.getfoundry.sh/reference/cli/forge/build

[profile.default]
src = "src"
out = "out"
# OZ contracts + forge-std come from npm (see remappings.txt + package.json),
# not git submodules. `libs` is searched only for *unremapped* imports, but
# listing `node_modules` here also helps forge resolve bare-package paths
# (e.g. `import "forge-std/Test.sol"`) cleanly without remappings.
libs = ["node_modules", "lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
# Read access to the whole package root so forge can read .sol sources
# from anywhere — including node_modules/. This is a permissive setting
# because we're not running untrusted scripts; tighten if that changes.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "./node_modules" },
    { access = "read-write", path = "./test/fixtures" },
]
auto_detect_solc = false

# Verbose revert reasons in tests.
verbosity = 2

# Invariant / fuzz tuning. CourseMarket invariant suite explores a small state
# space; cap depth so CI does not spend minutes per run. Override per-test via
# FOUNDRY_INVARIANT_* env vars or `forge test --invariant-*` flags.
[invariant]
runs = 32
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Treat warnings as errors when explicitly enabled (`FOUNDRY_PROFILE=ci forge build`).
[profile.ci]
deny_warnings = true

# ---------- RPC ----------
# To override, run: FOUNDRY_PROFILE=mainnet forge build  (then provide MAINNET_RPC_URL).
[profile.mainnet]
eth_rpc_url = "${MAINNET_RPC_URL}"

[doc]
out = "docs"
title = "x-web3 contracts"